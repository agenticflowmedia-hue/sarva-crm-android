name: Build SARVA Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-android-apk.yml"
      - "SARVA_CRM_Cloud_APK_Build_Project.zip"
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify uploaded SARVA project archive
        run: |
          echo "772b2371c6cfc4156035a5c70fe7a59bd37ba3cf2ba15a2426813f1363d5034a  SARVA_CRM_Cloud_APK_Build_Project.zip" | sha256sum -c -
          unzip -l SARVA_CRM_Cloud_APK_Build_Project.zip

      - name: Extract original Android project
        run: unzip -o -q SARVA_CRM_Cloud_APK_Build_Project.zip

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compile installable debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SARVA-CRM-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
