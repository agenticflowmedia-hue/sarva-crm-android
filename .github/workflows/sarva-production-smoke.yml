name: SARVA CRM production smoke checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/sarva-production-smoke.yml]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Validate live Production CRM routes and Google ownership
        run: |
          set -euo pipefail
          ROOT="https://om-sarva-bhuta-crm-secure.vercel.app"
          for route in / /operations.html /enroll.html /review.html /verify.html /legacy-kyc.html /otp.html /app.js /manifest.webmanifest; do
            status="$(curl -L -s -o /tmp/sarva-page -w '%{http_code}' --retry 3 --max-time 30 "${ROOT}${route}")"
            if [[ "${status}" != "200" ]]; then
              echo "FAIL ${route} returned ${status}"
              exit 1
            fi
            size="$(wc -c < /tmp/sarva-page)"
            if (( size < 100 )); then
              echo "FAIL ${route} too small"
              exit 1
            fi
            echo "PASS ${route} HTTP 200 / ${size} bytes"
          done
          curl -fsSL "$ROOT/" | grep -Fq 'EG59doEGYjRvYT75gprpTEAMIt1XtbYMND0pM0NvpfU'
          curl -fsSL "$ROOT/otp.html" | grep -Fq 'sarva-customer-otp'
          curl -fsSL "$ROOT/operations.html" | grep -Fq 'legacy-kyc.html'
          echo "PASS verification tag, OTP route and historical KYC navigation"
      - name: Confirm OTP function does not permit anonymous action
        run: |
          set -euo pipefail
          status="$(curl -s -o /tmp/otp-response -w '%{http_code}' -X POST \
            'https://ezzvalwtvcadizcwlptm.supabase.co/functions/v1/sarva-customer-otp' \
            -H 'Content-Type: application/json' \
            --data '{"action":"send","enrollment_id":"00000000-0000-4000-8000-000000000000"}')"
          echo "Unauthenticated OTP request HTTP ${status}"
          if [[ "${status}" == "200" ]]; then
            echo "FAIL: unauthenticated action accepted"
            exit 1
          fi
          if [[ "${status}" != "401" && "${status}" != "403" ]]; then
            echo "FAIL: unexpected unauthenticated response"
            exit 1
          fi
          echo "PASS: unauthorized request blocked"
